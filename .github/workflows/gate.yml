# The full declared gate (scripts/ci_local.sh) on every push and pull request: the gate a commit passes
# on Rohan's machine, run from the locked environment. Rohan, 2026-10-18: «Sonar should be part of the
# CI gate for this project, and a full CI gate should also run upon push to github». The gate's Sonar
# step starts a SonarQube container on the runner, as it does on his machine, from the same pinned
# server and scanner images with the same rules (scripts/sonar_local.py).
name: gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: The declared gate (scripts/ci_local.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - name: Check out the whole history (Sonar dates its new code from it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # uv as on Rohan's machine (`uv --version`: 0.12.13), so the gate here runs the same tool; change it
      # here and in codspeed.yml together. The cache key hashes the project's own lock only: the archives'
      # lock files are invisible unless Rohan says to look in them (2026-10-13).
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.13"
          cache-dependency-glob: uv.lock

      # Trainer tests use importorskip for optional local installs. CI must exercise
      # them, so install the explicit training extra and prove it imports below.
      # The locked Linux Torch/CUDA wheels total about 3 GB compressed; avoid
      # retaining a second wheel cache beside installed libraries and Sonar images.
      - name: Install the locked environment including trainer tests
        run: uv sync --frozen --extra som-training --no-cache

      - name: Require the optional training dependency for the full gate
        run: .venv/bin/python -c "import torch; print(torch.__version__)"

      # The lockfile audit with all extras and groups (SquishOS repo-hygiene.md), the one the pre-push hook
      # makes before every push (scripts/push_checks.py), made again here. Advisory: it prints its named
      # result (no_known_flaws; flaws_found, each flaw with its package and the versions that fix it; or
      # audit_did_not_run, with pip-audit's messages saying why) and exits 1 for any result but
      # no_known_flaws, and the job carries on past this step (continue-on-error), so the gate below always
      # runs. Its findings are leads, not verdicts (repo-hygiene.md). That was the lead's proposal, which
      # Rohan accepted, 2026-10-18: «Agree with your fixes, implement them so we have a working gate/CI
      # action».
      - name: The lockfile audit (all extras and groups; advisory)
        continue-on-error: true
        run: .venv/bin/python scripts/push_checks.py audit

      - name: Raise the memory-map limit SonarQube's search engine needs
        run: sudo sysctl -w vm.max_map_count=524288

      - name: The gate
        run: bash scripts/ci_local.sh
