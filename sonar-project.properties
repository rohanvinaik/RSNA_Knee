# The SonarQube step of the gate (scripts/ci_local.sh), here and on GitHub: scripts/sonar_local.py runs
# it, per SquishOS verification-gates.md, "Local SonarQube Docker check (pre-push)". It blocks only on an
# open bug or vulnerability (Rohan, 2026-10-18: «only bare correctness issues should be blocking»).
sonar.projectKey=RSNA_Knee
sonar.projectName=RSNA_Knee
sonar.sourceEncoding=UTF-8

# The production path: the knee package and the one CLI that runs it. The development and drawing
# scripts, the archives (invisible unless Rohan says to look in them) and data/ are not sources.
sonar.sources=src,scripts/run_interiors.py
sonar.tests=tests
sonar.exclusions=archive/**,archive2/**,data/**,**/__pycache__/**
# Detective regenerates these wholesale; pytest still collects and runs them.
sonar.test.exclusions=tests/detective/**

sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml

# Selects the SonarQube batch JGit blame because native Git blame stalled during this project scan.
# See: https://community.sonarsource.com/t/sonarscanner-blame-falling-back-to-git-native-blame-how-to-debug/116685
sonar.scm.use.blame.algorithm=GIT_FILES_BLAME
