# The local SonarQube check (advisory, before a push): scripts/sonar_local.py runs it, per SquishOS
# verification-gates.md, "Local SonarQube Docker check (pre-push)".
sonar.projectKey=RSNA_Knee
sonar.projectName=RSNA_Knee
sonar.sourceEncoding=UTF-8

# The production path: the knee package and the one CLI that runs it. The development and drawing
# scripts, the archives (invisible unless Rohan says to look in them) and data/ are not sources.
sonar.sources=src,scripts/run_interiors.py
sonar.tests=tests
sonar.exclusions=archive/**,archive2/**,data/**,**/__pycache__/**
# Detective regenerates these wholesale; pytest still collects and runs them.
sonar.test.exclusions=tests/detective/**

sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
