[project]
name = "rsna-knee"
version = "0.1.0"
description = "RSNA Knee Abnormality Detection — classical-AI data-geometry entry (KneeDiff)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "pandas",
    "pydicom",
    "SimpleITK",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["detective: test generated by Detective"]

[tool.ruff.lint]
# N999: package name `RSNA_Knee` is the repo's bootstrap convention
# (bootstrap_competition.sh derives the module name from the folder name);
# renaming would churn the Detective-pinned suites for no behavioural gain.
ignore = ["N999"]
