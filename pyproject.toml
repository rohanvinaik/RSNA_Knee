[project]
name = "rsna-knee"
version = "0.1.0"
description = "RSNA Knee Abnormality Detection — classical-AI data-geometry entry (KneeDiff)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "pydicom",
    "python-gdcm>=3.2.6",
]

[project.optional-dependencies]
jit = [
    "numba>=0.68.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# VERIFY is a uv-managed CPython (AGENTS.md, override 4), as Detective's own environment is.
python-preference = "only-managed"

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.12" }
profiling = { requires-python = ">=3.12" }

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/knee"]

[tool.coverage.report]
show_missing = true

# Enforce the existing production/dev separation; stage boundaries remain the founder's.
[tool.importlinter]
root_package = "knee"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Production does not import development or drawing tools"
type = "forbidden"
source_modules = ["knee"]
forbidden_modules = [
    "Detective", "Wesker", "pytest", "hypothesis", "crosshair", "coverage",
    "importlinter", "memray", "viztracer", "scalene", "pyinstrument", "line_profiler",
    "matplotlib", "hamilton", "graphviz",
]
allow_unmatched_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# The archives are invisible unless Rohan says to look in them (2026-10-13).
addopts = ["-ra", "--strict-markers", "--strict-config", "--ignore=archive", "--ignore=archive2"]
xfail_strict = true
filterwarnings = ["error"]
log_level = "INFO"
markers = ["detective: test generated by Detective"]

[tool.ruff]
# The archives are invisible unless Rohan says to look in them (2026-10-13).
extend-exclude = ["archive", "archive2"]

[tool.ruff.lint]
extend-select = ["B"]

[tool.ruff.lint.per-file-ignores]
# Detective regenerates these wholesale and checksums them; their import block is its own, and a
# crash witness it writes catches BaseException on purpose, to name any other exception as the
# wrong one (2026-10-12, the first crash-only survivors it pinned).
"tests/detective/*" = ["I001", "BLE001"]

[tool.ruff.lint.isort]
# The drawing scripts are the run's sibling modules, resolved because a script's directory is on
# sys.path when it is run as a script. They are ours, not third-party.
known-first-party = ["knee", "object_interiors", "object_assignments"]

[tool.ty.src]
exclude = ["archive", "archive2"]

[tool.deptry]
extend_exclude = ["archive", "archive2"]
# The drawing scripts are the run's neighbouring scripts, not external distributions.
known_first_party = ["knee", "object_interiors", "object_assignments"]

[tool.deptry.per_rule_ignores]
# Detective/Wesker are development readers; Hamilton is the development observation graph; and
# matplotlib is the drawing layer's, in the dev group since 2026-10-12 (the founder: "You can just
# add matplotlib in"), imported only by the drawing scripts and never by `knee`, which the import
# contract enforces. Each is a development tool that development code imports, which is what
# DEP004 asks.
DEP004 = ["Detective", "Wesker", "hamilton", "matplotlib"]
# A pydicom decoder plugin: pydicom loads it, and nothing imports it by name.
DEP002 = ["python-gdcm"]

[tool.deptry.package_module_name_map]
detective-spec = "Detective"
wesker = "Wesker"
scikit-image = "skimage"
SimpleITK = "SimpleITK"
crosshair-tool = "crosshair"
import-linter = "importlinter"
python-gdcm = "gdcm"
apache-hamilton = "hamilton"

[dependency-groups]
dev = [
    "apache-hamilton[visualization]>=1.90.0",
    "coverage>=7.10",
    "crosshair-tool>=0.0.111",
    "detective-spec>=1.1.1",
    "hypothesis>=6.168.5",
    "import-linter>=2.15",
    "matplotlib>=3.11.2",
    "numba>=0.68.0",
    "pytest>=9.1.1",
    "ruff==0.16.7",
    "wesker>=1.1.1",
]
# These execute the target: they must share the project's interpreter, never a global tool venv.
# Opt in with just setup-profile; absent from production dependencies and ordinary setup.
profiling = [
    "line-profiler>=5.0",
    "memray>=1.19",
    "pyinstrument>=5.1",
    "scalene>=2.3.0",
    "viztracer>=1.1.1",
]
