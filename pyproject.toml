[project]
name = "rsna-knee"
version = "0.1.0"
description = "RSNA Knee Abnormality Detection — classical-AI data-geometry entry (KneeDiff)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "pandas",
    "pydicom",
    "SimpleITK",
    "python-gdcm>=3.2.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# VERIFY is a uv-managed CPython (AGENTS.md, override 4), as Detective's own environment is.
python-preference = "only-managed"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
log_level = "INFO"
markers = ["detective: test generated by Detective"]

[tool.ruff]
# The archive is dug from as needed; it is not the codebase.
extend-exclude = ["archive"]

[tool.ruff.lint]
extend-select = ["B"]

[tool.ruff.lint.per-file-ignores]
# Detective regenerates these wholesale and checksums them; their import block is its own.
"tests/detective/*" = ["I001"]

[tool.ty.src]
exclude = ["archive"]

[tool.deptry]
extend_exclude = ["archive"]
known_first_party = ["knee"]

[tool.deptry.per_rule_ignores]
# Imported only by the dev script scripts/detective_resolution.py.
DEP004 = ["Detective", "Wesker"]
# A pydicom decoder plugin: pydicom loads it, and nothing imports it by name.
DEP002 = ["python-gdcm"]

[tool.deptry.package_module_name_map]
detective-spec = "Detective"
wesker = "Wesker"
scikit-image = "skimage"
SimpleITK = "SimpleITK"
crosshair-tool = "crosshair"
import-linter = "importlinter"
python-gdcm = "gdcm"

[dependency-groups]
dev = [
    "crosshair-tool>=0.0.111",
    "detective-spec>=1.1.1",
    "hypothesis>=6.168.5",
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "ruff==0.16.7",
    "wesker>=1.1.1",
]
