[project]
name = "rsna-knee"
version = "0.1.0"
description = "RSNA Knee Abnormality Detection — classical-AI data-geometry entry (KneeDiff)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "pandas",
    "pydicom",
    "SimpleITK",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["detective: test generated by Detective"]

[tool.ruff]
# The archive is dug from as needed; it is not the codebase.
extend-exclude = ["archive"]
